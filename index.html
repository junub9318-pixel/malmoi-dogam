<!doctype html><html><head><script>if(/\.github\.io$/.test(location.hostname))location.replace('https://malmoi-dogam.vercel.app/'+(location.search||''));</script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>말모이 도감 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 손으로 그린 그림책 공책: 파란 줄 공책 위에, 먹색 테두리로 오려 붙인 조각들. 한글 쓰기 공책의 십자 점선 칸과 진짜 도장을 쓴다. */
:root{
  --paper:#FAFBFF; --rule:#DDE7F5; --card:#FFFFFF; --soft:#EAF0FB; --ink:#1F2A44; --muted:#58637F; --shade:#1F2A44;
  --blue:#79C6EA; --pink:#F9A0BC; --yellow:#FFD84D; --green:#7ED4A6; --red:#C4352A; --kraft:#EBCB8F;
  --edge-c:#2A86BA; --edge-v:#CF3E78;
  --tile-ink:#1F2A44; --accent:#2F5BD3; --accent-ink:#FFFFFF; --good:#DDF3E7; --good-ink:#17744C; --warn:#FFF0B8;
  --line:#C3D1E8;
  --bg:var(--paper); --surface:var(--card); --surface-2:var(--soft); --ink-soft:var(--muted);
  --brand:var(--accent); --brand-ink:var(--accent-ink); --sun:var(--yellow); --ok:var(--good-ink); --ok-bg:var(--good); --nudge-bg:var(--warn);
  --t-blue:var(--blue); --t-yellow:var(--yellow); --t-pink:var(--pink); --t-mint:var(--green);
  --font-hand:'Gaegu','Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',cursive;
  --font-block:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:var(--font-block);
  --r1:20px 26px 18px 28px / 26px 18px 28px 20px;
  --r2:26px 18px 28px 20px / 18px 28px 20px 26px;
}
/* 어두운 쪽은 칠판: 분필색 테두리 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D2B2C; --rule:#27393A; --card:#27393A; --soft:#2F4445; --ink:#F1EEE3; --muted:#A9BDB8; --shade:rgba(0,0,0,.55);
    --blue:#6DB9DC; --pink:#EE8FAE; --yellow:#F2CB45; --green:#6BC796; --red:#F58A7B; --kraft:#6A563A;
    --edge-c:#7CC4E6; --edge-v:#F29DBB; --accent:#8FB4FF; --accent-ink:#10203A; --good:#1F4D3A; --good-ink:#8FE0B5; --warn:#4B4220; --line:#3E5557;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1D2B2C; --rule:#27393A; --card:#27393A; --soft:#2F4445; --ink:#F1EEE3; --muted:#A9BDB8; --shade:rgba(0,0,0,.55);
  --blue:#6DB9DC; --pink:#EE8FAE; --yellow:#F2CB45; --green:#6BC796; --red:#F58A7B; --kraft:#6A563A;
  --edge-c:#7CC4E6; --edge-v:#F29DBB; --accent:#8FB4FF; --accent-ink:#10203A; --good:#1F4D3A; --good-ink:#8FE0B5; --warn:#4B4220; --line:#3E5557;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font-family:inherit;color:inherit}
p{margin:0}
.dogam h4{font-family:var(--font-display);font-weight:400;font-size:1.05rem;margin:18px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dogam h4 span{font-family:var(--font-body);font-size:.85rem;color:var(--ink-soft)}
.stamps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stamp .se{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:transparent}
.stamp.on .se{border:3px solid var(--sun);background:var(--surface)}
.stamp .sn{font-size:.72rem;line-height:1.2;color:var(--ink-soft)}
.stamp.on .sn{color:var(--ink)}
.stampget{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--nudge-bg);font-family:var(--font-display);font-size:1.05rem}
.stampbig{font-size:2rem;display:inline-block;animation:stampin .5s ease-out}
@keyframes stampin{from{transform:scale(2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.gstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.gstats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.gstats b{font-family:var(--font-display);font-weight:400;font-size:1.9rem;color:var(--brand)}
.gstats span{font-size:.88rem;color:var(--ink-soft)}
.gcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-top:12px}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.gcols .gbox{margin-top:0}
.gbox h4{font-family:var(--font-display);font-weight:400;font-size:1.05rem;margin:0 0 10px}
.gbox h4 small{font-family:var(--font-body);font-size:.8rem;color:var(--ink-soft);margin-left:6px}
.gweek{display:flex;align-items:flex-end;gap:8px;height:92px}
.gday{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.gday i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--brand)}
.gday span{font-size:.8rem;color:var(--ink-soft)}
.glist,.gtips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.glist li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.glist b{font-family:var(--font-display);font-weight:400;font-size:1.1rem}
.glist span{font-size:.86rem;color:var(--ink-soft)}
.gtips li{padding-left:16px;position:relative}
.gtips li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--sun)}
.gacts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.gempty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.gempty p{margin:0}
.gsample{margin:16px 0 0;padding:8px 12px;border-radius:12px;background:var(--nudge-bg);font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;font:inherit;padding:0 4px}
.gnote{margin-top:16px;font-size:.9rem;color:var(--ink-soft)}
@media (max-width:760px){.gstats{grid-template-columns:repeat(2,minmax(0,1fr))}.gcols{grid-template-columns:1fr}.gcols .gbox{margin-top:12px}.gcols .gbox:first-child{margin-top:0}}

:focus-visible{outline:4px solid var(--accent);outline-offset:3px;border-radius:12px}
.ic{width:28px;height:28px;display:block;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:38px;height:38px}.ic.xl{width:112px;height:112px}.ic.hand{width:52px;height:60px}
.app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* 위쪽 줄: 오늘의 길(점선으로 이어진 세 곳), 도감, 어른용 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prog{list-style:none;margin:0 0 0 4px;padding:0;display:flex;align-items:center}
.prog li{width:52px;height:52px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;position:relative;opacity:.6}
.prog li+li{margin-left:24px}
.prog li+li::before{content:"";position:absolute;right:100%;top:50%;width:24px;border-top:3px dashed var(--ink);margin-top:-2px}
.prog li.on{opacity:1;background:var(--yellow);transform:scale(1.14) rotate(-3deg);box-shadow:3px 3px 0 var(--shade)}
.prog li.done{opacity:1;background:var(--green)}
.barbtn{display:flex;gap:10px}
.ibtn{width:52px;height:52px;background:var(--card);border:3px solid var(--ink);border-radius:var(--r1);box-shadow:3px 3px 0 var(--shade);cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ibtn:nth-child(2){border-radius:var(--r2);transform:rotate(1.5deg)}
.ibtn:nth-child(3){transform:rotate(-1.5deg)}
.ibtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shade)}
.ibtn[hidden]{display:none}
.ibtn.hold::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--red);animation:holdring 1.5s linear forwards}
@keyframes holdring{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* 안내자와 말풍선 */
.guiderow{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:center}
.who{width:100px;height:100px;position:relative}
.who svg{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:visible}
.who[data-who="squirrel"] .squirrel,.who[data-who="fairy"] .fairy{display:block}
.who .o{stroke:var(--ink);stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:10px 24px 22px 20px / 10px 20px 24px 22px;box-shadow:3px 3px 0 var(--shade);padding:10px 16px;font-family:var(--font-hand);font-weight:700;font-size:1.5rem;line-height:1.25;min-height:64px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-11px;top:24px;width:16px;height:16px;background:inherit;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble.nudge{background:var(--warn)}
.bubble.good{background:var(--good)}
.squirrel .tail{transform-origin:74px 100px;animation:wag 2.6s ease-in-out infinite}
.fairy .body{animation:floaty 2.6s ease-in-out infinite}
.fairy .wl{transform-origin:44px 44px;animation:flapl .45s ease-in-out infinite alternate}
.fairy .wr{transform-origin:76px 44px;animation:flapr .45s ease-in-out infinite alternate}
.who.cheer svg{animation:hop .55s ease-out 2}
.who.think svg{animation:tilt 1.1s ease-in-out 1}
@keyframes wag{50%{transform:rotate(-9deg)}}
@keyframes floaty{50%{transform:translateY(-5px)}}
@keyframes flapl{to{transform:rotate(-14deg) scaleX(.85)}}
@keyframes flapr{to{transform:rotate(14deg) scaleX(.85)}}
@keyframes hop{40%{transform:translateY(-16px) rotate(-4deg)}}
@keyframes tilt{30%,70%{transform:rotate(-9deg)}}

/* 화면 */
.stage{flex:1;display:flex;flex-direction:column;gap:16px;align-items:stretch;min-width:0}
.stage.s-home,.stage.s-scan,.stage.s-find,.stage.s-cele{justify-content:center}
.bigcam{width:min(62vw,236px);aspect-ratio:1;border-radius:50%;margin:8px auto 0;background:var(--yellow);border:4px solid var(--ink);display:grid;place-items:center;position:relative;cursor:pointer;box-shadow:6px 6px 0 var(--shade);padding:0}
.bigcam:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--shade)}
.bigcam .ring{position:absolute;inset:-8px;border-radius:50%;border:4px dashed var(--ink);animation:ringp 2.2s ease-out infinite;pointer-events:none}
.bigcam .ring.r2{animation-delay:1.1s}
@keyframes ringp{from{transform:scale(1);opacity:.6}to{transform:scale(1.26);opacity:0}}
.tapme{display:flex;justify-content:center;animation:tapbob 1.3s ease-in-out infinite}
@keyframes tapbob{50%{transform:translateY(-12px)}}
.objs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:420px;margin:6px auto 0;width:100%}
.obj{background:var(--card);border:3px solid var(--ink);border-radius:var(--r1);min-height:128px;font-size:3.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--shade);padding:0}
.obj:nth-child(even){border-radius:var(--r2);transform:rotate(1.2deg)}
.obj:nth-child(odd){transform:rotate(-1.2deg)}
.obj:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shade)}
.scan{position:relative;display:flex;justify-content:center;padding:24px 0}
.pic{font-size:4rem;line-height:1;background:var(--card);border:3px solid var(--ink);border-radius:var(--r1);box-shadow:4px 4px 0 var(--shade);padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;transform:rotate(-2deg)}
.pic.big{font-size:6rem;padding:20px 28px}
.photo{height:84px;width:auto;max-width:150px;object-fit:cover;border-radius:8px;display:block}
.pic.big .photo{height:170px;max-width:70vw}
.scan .lens{position:absolute;left:50%;top:50%;margin:-56px 0 0 -56px;animation:lensmove 1.6s ease-in-out infinite alternate}
@keyframes lensmove{from{transform:translate(-70px,-40px) rotate(-12deg)}to{transform:translate(70px,40px) rotate(12deg)}}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);animation:dotb 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dotb{50%{transform:translateY(-10px)}}

.buildtop{display:flex;align-items:center;gap:14px}
.spk{width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);cursor:pointer;box-shadow:4px 4px 0 var(--shade);padding:0;display:grid;place-items:center}
.spk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shade)}
.preview{margin-left:auto;font-family:var(--font-block);font-size:3.8rem;line-height:1;min-width:84px;text-align:center;color:var(--ink)}
.slots{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sblock{display:grid;gap:5px;padding:6px;background:var(--soft);border:3px solid var(--ink);border-radius:var(--r1)}
.sblock:nth-child(even){border-radius:var(--r2);transform:rotate(.8deg)}
.sblock:nth-child(odd){transform:rotate(-.6deg)}
.sblock.t-v{grid-template-columns:auto auto}
.sblock.t-v.has-t{grid-template-areas:"c v" "t t"}
.sblock.t-v.no-t{grid-template-areas:"c v"}
.sblock.t-h{grid-template-columns:auto}
.sblock.t-h.has-t{grid-template-areas:"c" "v" "t"}
.sblock.t-h.no-t{grid-template-areas:"c" "v"}
.a-c{grid-area:c}.a-v{grid-area:v}.a-t{grid-area:t}
/* 칸: 한글 쓰기 공책처럼 십자 점선이 있고, 자음 칸은 파랑, 모음 칸은 분홍 점선 */
.slot{--g:var(--edge-c);width:76px;height:76px;border:3px solid var(--ink);border-radius:6px;background:repeating-linear-gradient(to bottom,var(--g) 0 5px,transparent 5px 10px) center/2px 100% no-repeat,repeating-linear-gradient(to right,var(--g) 0 5px,transparent 5px 10px) center/100% 2px no-repeat,var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-block);font-size:2.3rem;color:var(--tile-ink);padding:0;cursor:default;position:relative}
.slot.kv{--g:var(--edge-v)}
.sblock.t-v .slot.a-t{width:auto}
.slot small{position:absolute;right:4px;bottom:2px;font-family:var(--font-body);font-size:.68rem;color:var(--g);line-height:1}
.slot.over{background:repeating-linear-gradient(to bottom,var(--g) 0 5px,transparent 5px 10px) center/2px 100% no-repeat,repeating-linear-gradient(to right,var(--g) 0 5px,transparent 5px 10px) center/100% 2px no-repeat,var(--yellow);transform:scale(1.06)}
.slot.filled{background:var(--blue)}
.slot.filled.kv{background:var(--pink)}
.slot.filled small{display:none}
.slot.shake{animation:wobble .5s}
.slot.want{outline:5px solid var(--yellow);outline-offset:2px}
.gch{opacity:.28}
@keyframes wobble{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tray{display:flex;flex-wrap:wrap;gap:14px;padding:16px 12px;min-height:116px;background:var(--kraft);border:3px solid var(--ink);border-radius:var(--r2);box-shadow:4px 4px 0 var(--shade);justify-content:center;align-items:center}
.tile{--ts:80px;width:var(--ts);aspect-ratio:1;border:3px solid var(--ink);border-radius:var(--r1);color:var(--tile-ink);font-family:var(--font-block);font-size:calc(var(--ts)*.5);display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--shade);position:relative;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;padding:0}
.tile[data-r="1"]{border-radius:var(--r2)}
.tile[data-r="2"]{border-radius:24px 20px 26px 16px / 18px 26px 20px 24px}
.tile[data-r="3"]{border-radius:16px 26px 20px 24px / 24px 20px 26px 18px}
.tile.kc{background:var(--blue)}.tile.kv{background:var(--pink)}
.tray .tile{transform:rotate(var(--r,0deg)) translateY(var(--dy,0))}
.tile.lifted{opacity:.25}
.tile.pulse{animation:pulse 1s ease-in-out infinite}
.tile.pop{animation:scatter .6s cubic-bezier(.2,1.3,.4,1) both}
.tile.want{outline:5px solid var(--yellow);outline-offset:3px}
.tile.back{animation:wobble .5s}
.tile .mark{position:absolute;top:-12px;right:-12px;width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tile .mark .ic{width:18px;height:18px;stroke-width:2.5}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg);--ts:84px}
.flyer{position:fixed;left:0;top:0;z-index:95;pointer-events:none;display:flex;align-items:center;justify-content:center}
.hand{position:fixed;left:0;top:0;pointer-events:none;z-index:80;margin:-6px 0 0 -16px;opacity:0}
@keyframes pulse{50%{box-shadow:3px 3px 0 var(--shade),0 0 0 9px var(--yellow)}}
@keyframes scatter{from{transform:translate(calc(var(--dx,0px)*-1),-60px) scale(.2) rotate(120deg);opacity:0}}
.side{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:56px}
.hbtn{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--card);cursor:pointer;box-shadow:3px 3px 0 var(--shade);padding:0;display:grid;place-items:center}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shade)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.9rem;cursor:pointer;text-decoration:underline;padding:8px}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,380px);margin:8px auto 0;min-height:76px;border:4px solid var(--ink);border-radius:30px 36px 32px 34px / 34px 30px 36px 32px;background:var(--yellow);color:var(--tile-ink);font-family:var(--font-block);font-size:1.8rem;cursor:pointer;box-shadow:5px 5px 0 var(--shade);animation:gonod 2.4s ease-in-out infinite;padding:0 24px}
.go .ic{width:32px;height:32px;stroke:var(--tile-ink)}
.go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shade)}
@keyframes gonod{0%,100%{rotate:-.8deg}50%{rotate:.8deg}}
.target{align-self:center;font-size:6.5rem;line-height:1;background:var(--card);border:4px dashed var(--ink);border-radius:var(--r2);padding:16px 30px;animation:tapbob 1.8s ease-in-out infinite}
.cele{display:flex;flex-direction:column;align-items:center;gap:18px}
.pair{display:flex;align-items:center;justify-content:center;gap:16px;font-size:3.4rem}

/* 도장: 줄이 맞게 왼쪽 정렬, 글자는 균형 있게 줄바꿈 */
.stampget{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));justify-items:start;gap:10px 18px}
.stampget .one{min-width:0;text-wrap:balance}
.stamps li{text-wrap:balance}
/* 어른 메뉴: 안내 문구가 비어 있으면 자리를 차지하지 않게 */
.modes-d:empty{margin:0;min-height:0}
body.nofab #roomFab{display:none}
.stampget{width:100%}
/* 고를 사물이 3개일 때 마지막 하나도 가운데로 */
.objs{display:flex;flex-wrap:wrap;justify-content:center}
.objs .obj{flex:0 0 calc(50% - 8px);min-width:0}
.go.back .ic{stroke:var(--ink)}
/* 넓은 화면에서 지우기 버튼이 지나치게 늘어나지 않게 */
.fpad{width:100%;max-width:560px;margin-inline:auto}
/* 작은 글자와 누르는 곳 키우기 */
.linkbtn{min-height:44px;padding:10px 16px;font-size:1rem}
.slot small{font-size:.8rem;color:var(--muted)}

/* 찾기 화면의 '다음에 찍을게요': 눈에 띄는 보조 버튼 (위의 큰 버튼보다는 작게) */
.skiprow{display:flex;justify-content:center;margin-top:22px}
.go.sm.skip{background:var(--card);color:var(--ink);min-height:60px;font-size:1.3rem;padding:0 24px;gap:10px}
.go.sm.skip .ic{width:28px;height:28px;stroke:var(--ink)}

.sblock.done .slot{border-color:var(--ink)}
/* ===== 선생님 의견 반영 ===== */
.bubble{font-family:var(--font-body);font-weight:700;font-size:1.6rem;line-height:1.38;letter-spacing:0}
@media (max-width:420px){.bubble{font-size:1.5rem}}
body.learning #bookBtn,body.learning #adultBtn,body.learning #hudBtn,body.learning #roomFab{display:none}
.slot.ghosty:not(.filled){position:relative}
.slot.ghosty:not(.filled)::after{content:attr(data-ch);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:inherit;color:var(--ink);opacity:.32;pointer-events:none;animation:ghostblink 1.2s ease-in-out 5}
@keyframes ghostblink{0%,100%{opacity:.08}50%{opacity:.5}}
.gch{display:block;width:70%;height:70%;margin:0 auto;opacity:.75;color:var(--ink)}
.gch text{font-family:var(--font-block)}
.sent{margin:6px auto 0;max-width:34rem;padding:10px 16px;background:var(--card);border:3px solid var(--ink);border-radius:var(--r1);box-shadow:3px 3px 0 var(--shade);font-family:var(--font-body);font-weight:700;font-size:1.5rem;line-height:1.4;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.sent button{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);color:#1F2A44;display:grid;place-items:center;cursor:pointer}
.sent .ic{width:28px;height:28px}
.todayrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.tlabel{font-family:var(--font-hand);font-weight:700;font-size:1.3rem}
.tword{min-height:60px;display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);color:#1F2A44;font-family:var(--font-body);font-weight:700;font-size:1.25rem;cursor:pointer;box-shadow:3px 3px 0 var(--shade)}
.tword{font-size:1.5rem}.tword b{font-size:1.25rem}
.goal{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-family:var(--font-hand);font-weight:700;font-size:1.3rem}
.gdots{display:inline-flex;gap:6px}.gdots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--card)}.gdots i.on{background:var(--yellow)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0}
.pl{font-weight:700;min-width:5.5em}
.pin{flex:1 1 12rem;min-height:44px;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea.pin{width:100%;flex-basis:100%}
.pcode{margin-top:8px}.pcode summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.card{cursor:pointer}
@media (prefers-reduced-motion:reduce){.slot.ghosty:not(.filled)::after{animation:none;opacity:.35}}
body.calm .slot.ghosty:not(.filled)::after{animation:none;opacity:.35}

body:not(.did) #roomFab,body:not(.did) .hgo{display:none}
.privacy{margin:14px auto 0;max-width:30rem;text-align:center;font-size:.98rem;line-height:1.5;color:var(--muted)}
</style>

          else scheduleHand();
        }
        el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      });
    });
  }
  cam.addEventListener('change', function(){
    var f = cam.files && cam.files[0]; cam.value = '';
    S.camMode = S.screen === 'find' ? 'verify' : 'start';
    if (f) handlePhoto(f);
  });
  stageEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'camera'){ S.camMode = S.screen === 'find' ? 'verify' : 'start'; cam.click(); }
    else if (act === 'shoot'){
      S.token++; S.m = cardMission(b.dataset.w); S.thumb = null; S.foundNext = false; S.screen = 'scan'; render(); say('찰칵! 살펴보고 있어요.');
      var tk = S.token; setTimeout(function(){ if (tk === S.token) startBuild('asm1'); }, 1300);
    }
    else if (act === 'sentspk'){ var sw = (S.phase === 'asm1' ? S.m : S.m.next).word; try { window.speechSynthesis.cancel(); } catch (x) {} voiceSay(sentenceOf(sw), .8); }
    else if (act === 'listen'){ speak((S.phase === 'asm1' ? S.m : S.m.next).word, true); }
    else if (act === 'hint'){ giveHint(); }
    else if (act === 'wrongname'){
      var m0 = S.m, nx = m0.cands && m0.cands[m0.ci + 1];
      if (nx){ var m1 = mk(nx, m0.e, m0.photo); m1.cands = m0.cands; m1.ci = m0.ci + 1; S.m = m1; S.foundNext = false; var n1 = pickNext(m1); if (n1) m1.next = n1; startBuild('asm1'); }
      else { handleHome(); say('다른 이름을 못 찾았어요. 다시 찍어 볼까요?', 'nudge'); }
    }
    else if (act === 'next'){ if (S.phase === 'asm1'){ if (S.m.next) startBuild('asm2'); else toFind(); } else toFind(); }
    else if (act === 'verify'){
      var n = b.dataset.n;
      if (n === S.m.next.name) found(S.m.next);
      else say('이건 ' + ieyo(n) + '. ' + eul(S.m.next.name) + ' 다시 찾아봐요!', 'nudge');
    }
    else if (act === 'skip'){ S.foundNext = false; S.screen = 'cele'; render(); say('괜찮아요! 다음에 찾아봐요.', 'good'); }
    else if (act === 'again'){ handleHome(); }
    else if (act === 'room'){ openRoom(); }
    else if (act === 'free'){ S.token++; S.screen = 'free'; S.fseq = []; S.fres = null; S.fbusy = false; S.fhint = 0; S.stampNow = []; S.last = null; render(); say('모은 조각을 눌러 새 단어를 만들어 봐요!'); }
    else if (act === 'fadd'){ if (S.fseq.length < 9){ S.fseq.push(b.dataset.ch); S.fres = null; S.fhint = 0; render(); } }
    else if (act === 'fdel'){ S.fseq.pop(); S.fres = null; S.fhint = 0; render(); }
    else if (act === 'fclr'){ S.fseq = []; S.fres = null; S.fhint = 0; render(); }
    else if (act === 'fcheck'){ fcheck(); }
    else if (act === 'fspeak'){ if (S.fres) speak(S.fres.word, true); }
    else if (act === 'fhint'){
      if (!S.fres || !S.fres.sim) return;
      S.fhint = Math.min(2, S.fhint + 1); render();
      say(S.fhint === 1 ? '비슷한 진짜 단어는 ' + analyze(S.fres.sim).syl.length + '글자예요.' : '점선 칸이 달라요. 빼거나 더할 조각을 봐요.', 'nudge');
    }
  });
  stageEl.addEventListener('click', function(e){
    var s = e.target.closest('.slot'); if (!s || S.screen !== 'build') return;
    var i = +s.dataset.i; if (S.slots[i] !== null) { var tl = S.tiles.filter(function(x){ return x.id === S.slots[i]; })[0]; if (tl) speak(JAMO_NAME[tl.ch] ? JAMO_NAME[tl.ch] : tl.ch, true); }
  });
  $('#homeBtn').addEventListener('click', handleHome);

  /* 도감과 어른용 창 */
  function openSheet(id){ $('#' + id).hidden = false; $('#' + id + ' .close').focus(); }
  function closeSheets(){ $$('.sheet').forEach(function(s){ s.hidden = true; }); }
  $$('[data-close]').forEach(function(b){ b.addEventListener('click', closeSheets); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheets(); });
  $('#bookBtn').addEventListener('click', function(){ renderCards(); renderStamps(); openSheet('book'); });
  /* 어른용 버튼은 아이가 실수로 열지 않도록 1.5초 꾹 누르거나, 빠르게 두 번 눌러야 열린다 */
  (function(){
    var btn = $('#adultBtn'), t = null, last = 0;
    function open(){ clearTimeout(t); btn.classList.remove('hold'); renderSync(); renderPlan(); planPull(); syncModes(); openSheet('adult'); }
    function start(){ btn.classList.add('hold'); clearTimeout(t); t = setTimeout(open, 1500); }
    function stop(){ btn.classList.remove('hold'); clearTimeout(t); }
    btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', stop); btn.addEventListener('pointerleave', stop); btn.addEventListener('pointercancel', stop);
    btn.addEventListener('click', function(){ var n = Date.now(); if (n - last < 600) open(); last = n; });
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  })();
  $('#modes').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode){ var k = b.dataset.mode; M[k] = !M[k]; saveModes(); syncModes(MODE_NOTE[k] + (M[k] ? '' : ' (꺼짐)')); if (k === 'voice' && M.voice) announce('소리로 안내를 켰어요.'); }
    else if (b.dataset.help !== undefined){ M.help = +b.dataset.help; saveModes(); syncModes(MODE_NOTE['help' + M.help]); }
  });
  var rc = 0;
  $('#resetCards').addEventListener('click', function(){
    if (!rc){ rc = 1; $('#resetNote').textContent = '정말 지울까요? 한 번 더 누르면 카드가 지워져요. (기록판은 그대로예요)'; return; }
    rc = 0; S.collected = {}; saveCards(); renderCards(); $('#resetNote').textContent = '카드를 지웠어요.';
  });
  $$('.sheet').forEach(function(s){ s.addEventListener('click', function(e){ if (e.target === s) closeSheets(); }); });

  syncModes(); renderCards(); renderStamps(); renderGuide(); bindGuide(); renderHud(); wearGuide(); renderPlan(); bindPlan();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) planPull(); });
  render(); coachEl.textContent = '사물을 찍어 볼까요?'; S.msg = coachEl.textContent;
  /* AI 사진 인식: Claude 안에서는 허용한 경우에, 서버 주소에서는 /api가 있을 때 켠다 */
  try {
    if (window.claude && window.claude.use){
      window.claude.use('sample').then(function(s){
        if (!s) return aiSet(null);
        return Promise.resolve(s.limits ? s.limits() : null).then(function(l){
          if (l && l.images){ sample = s; aiSet('claude'); } else aiSet(null);
        });
      }).catch(function(){ aiSet(null); });
    } else if (/^https?:$/.test(location.protocol)){
      fetch('/api/health').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if (j && j.ok){ VX.tts = j.tts === true; if (j.save === true) syncStart(); aiSet('server'); } else aiSet(null); }).catch(function(){ aiSet(null); });
    } else aiSet(null);
  } catch (e) { aiSet(null); }
  /* 서버 응답이 오래 걸려도 화면이 멈춰 보이지 않게 */
  setTimeout(function(){ if (!AI.ready) aiSet(null); }, 4000);
})();
</script>

</body></html>
